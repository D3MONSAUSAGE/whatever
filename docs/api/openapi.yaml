openapi: 3.0.3
info:
  title: Pantalla HTTP API
  version: 2d
  description: |
    HTTP API as of Phase 2D (scheduling, locations, screen groups), based on
    main `9855107`. New fields and routes are additive. Paths that existed in
    Phase 2C keep their previous fields, status codes, and error strings.
    When a display has no schedule rules, `GET /api/player/state` is unchanged.

    Hardening 1 (docs/HARDENING_1.md) adds `GET /api/overview`,
    `{ "locationId": null }` on display update, per-user 429 limits on uploads,
    publish, snapshot, and creates, and `GET /api/cron/orphan-uploads`.
    Success bodies stay the same. A rejected body does not consume a limit.
    Counters are per route, keyed by user id, using `rate_limit_hit`.

    Admin routes require `Authorization: Bearer <Supabase access token>`.
    They do not read cookies. `requireAdmin` (`lib/server/auth.ts`) verifies
    the JWT and resolves the caller's account.

    Player routes are for `public/player.html` only. A mobile app must not
    call them and must not store the display token they return.

    Error bodies are `{ "error": "<message>" }` with `Cache-Control: no-store`.
    Successful JSON uses the same cache header (`lib/server/http.ts`).
  license:
    name: Proprietary
servers:
  - url: https://pantalla-teamtegrate.vercel.app
    description: Production
tags:
  - name: account
  - name: media
  - name: displays
  - name: playlists
  - name: locations
  - name: groups
  - name: schedules
  - name: player
    description: TV only. Not for the mobile app.
  - name: ops
    description: Scheduled jobs. Not for the mobile app.
security:
  - bearerAuth: []
paths:
  /api/me:
    get:
      tags: [account]
      summary: Current owner
      description: |
        Verifies the JWT and calls `ensure_account`, which creates the account
        and its `Main location` on first use. Account name is derived from the
        email local-part (control characters stripped, trimmed, max 80) or
        `My business`.
      operationId: getMe
      responses:
        "200":
          description: Owner profile
          content:
            application/json:
              schema:
                type: object
                required: [email, accountName]
                properties:
                  email: { type: string }
                  accountName: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500":
          description: Account lookup failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "Couldn't load your account. Try again." }
    patch:
      tags: [account]
      summary: Rename the business (M8)
      description: |
        `accountName` is control-stripped and trimmed, 1–80 characters. Also
        marks the onboarding "business" step done. Does not change account IDs.
      operationId: patchMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountName]
              properties:
                accountName: { type: string, minLength: 1, maxLength: 80 }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  email: { type: string }
                  accountName: { type: string }
        "400": { description: Empty or too long }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/onboarding:
    get:
      tags: [account]
      summary: Setup progress (M8)
      description: |
        Derived from existing data; nothing is stored except `dismissed` and the
        business confirmation. Step ids in order: account, business, location,
        screen, media, playlist, publish, playing. `playing.confirmed` is true
        only when the TV itself confirmed painting the content. `show` is false
        when dismissed or finished. Accounts created before the M8 release that
        already have a screen, media, and published content are `finished`.
      operationId: getOnboarding
      responses:
        "200":
          description: Progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Onboarding" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [account]
      summary: Hide/resume setup, or confirm the business step (M8)
      operationId: postOnboarding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dismissed: { type: boolean }
                confirmBusiness: { type: boolean, enum: [true] }
      responses:
        "200":
          description: Updated progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Onboarding" }
        "400": { description: Nothing to update or bad value }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: Migration 0005 not applied }

  /api/analytics/summary:
    get:
      tags: [account]
      summary: Account analytics totals (M8)
      description: |
        `screens.offline` excludes `neverConnected`. Online = heartbeat within
        90 s. `uptime.pct7/pct30` are null until there are 10 minutes of
        coverage; `coverageFrom` is when measuring began. `playback` counts
        screens by status: confirmed (TV-reported), unconfirmed (published or
        scheduled, not confirmed by the TV), nothingAssigned. `media.bytes` is
        exact stored size. `bandwidth` is always null (not measured).
      operationId: getAnalyticsSummary
      responses:
        "200":
          description: Totals
          content:
            application/json:
              schema: { type: object }
              example:
                screens: { total: 2, online: 1, offline: 0, neverConnected: 1 }
                uptime: { pct7: 98.2, pct30: null, coverageFrom: "2026-10-30T19:00:00Z" }
                playback: { confirmed: 1, unconfirmed: 0, nothingAssigned: 1 }
                playlists: { total: 2, published: 1, publishes30d: 3 }
                schedules: { total: 1, enabled: 1, changes30d: 2 }
                media: { count: 9, images: 8, videos: 1, bytes: 10485760, inPlaylists: 6, unused: 2 }
                bandwidth: null
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: Migration 0005 not applied }

  /api/analytics/uptime:
    get:
      tags: [account]
      summary: Per-screen uptime (M8)
      operationId: getAnalyticsUptime
      parameters:
        - { name: days, in: query, required: false, schema: { type: integer, enum: [7, 30], default: 7 } }
      description: |
        `daily` has one entry per local day (screen's location time zone),
        oldest first; `uptimePct` null where there is no coverage.
      responses:
        "200":
          description: Uptime
          content:
            application/json:
              schema: { type: object }
              example:
                days: 7
                coverageFrom: "2026-10-30T19:00:00Z"
                overall: { uptimePct: 97.5 }
                screens:
                  - { id: "uuid", name: "Bar TV", online: true, lastSeenAt: "2026-10-31T10:00:00Z", uptimePct: 97.5, onlineSeconds: 50000, windowSeconds: 51282, daily: [{ date: "2026-10-31", uptimePct: 99.1 }] }
        "400": { description: days not 7 or 30 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/analytics/screens/{id}:
    get:
      tags: [account]
      summary: One screen's uptime, outages, and playback (M8)
      operationId: getAnalyticsScreen
      parameters:
        - { $ref: "#/components/parameters/Id" }
      description: |
        `offline[]` is newest first; an outage still in progress has
        `endedAt: null`. `playback.status` is confirmed | unconfirmed | nothing.
        `expected.source` is schedule | playlist | image | none.
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema: { type: object }
              example:
                id: "uuid"
                name: "Bar TV"
                online: true
                lastSeenAt: "2026-10-31T10:00:00Z"
                uptime7: 99.0
                uptime30: 97.1
                daily: [{ date: "2026-10-31", uptimePct: 99.1 }]
                coverageFrom: "2026-10-30T19:00:00Z"
                offline: [{ startedAt: "2026-10-31T02:00:00Z", endedAt: "2026-10-31T02:40:00Z", seconds: 2400 }]
                playback:
                  status: confirmed
                  confirmed: { version: 14, at: "2026-10-31T09:58:00Z" }
                  expected: { version: 14, source: playlist, name: "Lunch" }
                  match: true
                  history: [{ version: 14, at: "2026-10-31T09:58:00Z" }]
        "404": { description: Not this account's screen }

  /api/analytics/activity:
    get:
      tags: [account]
      summary: Recent activity, newest first (M8)
      operationId: getAnalyticsActivity
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: before, in: query, schema: { type: string, format: date-time } }
      description: |
        Kinds: playlist.published, screen.paired, screen.removed,
        screen.content_changed, schedule.created, schedule.updated,
        schedule.deleted, media.uploaded, media.deleted. Page with
        `before=nextBefore`. Kept 90 days.
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema: { type: object }
              example:
                events: [{ at: "2026-10-31T09:58:00Z", kind: playlist.published, subjectId: "uuid", subjectName: "Lunch", detail: {} }]
                nextBefore: null
        "400": { description: Bad before date }

  /api/alerts:
    get:
      tags: [account]
      summary: Offline/recovery alerts feed, newest first (M9)
      operationId: getAlerts
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: before, in: query, schema: { type: string, format: date-time } }
        - { name: unread, in: query, schema: { type: string, enum: ["1", "true"] } }
      description: |
        `unread` in the body is the account's total unread count (independent
        of paging). Page with `before=nextBefore`. Kept 90 days.
        `kind` is screen.offline | screen.recovered. `email` is off | pending | sent | skipped | failed.
      responses:
        "200":
          description: Alerts
          content:
            application/json:
              schema: { type: object }
              example:
                alerts: [{ id: "uuid", kind: screen.offline, screenId: "uuid", screenName: "Bar TV", at: "2026-10-31T10:12:00Z", offlineSince: "2026-10-31T10:01:30Z", offlineSeconds: null, read: false, email: skipped }]
                unread: 1
                nextBefore: null
        "400": { description: Bad before date }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: Migration 0006 not applied }

  /api/alerts/read:
    post:
      tags: [account]
      summary: Mark alerts read (M9)
      operationId: markAlertsRead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: { type: array, maxItems: 100, items: { type: string, format: uuid } }
                all: { type: boolean, enum: [true] }
      responses:
        "200":
          description: Done
          content:
            application/json:
              example: { ok: true, marked: 2 }
        "400": { description: Neither ids nor all }

  /api/alerts/preferences:
    get:
      tags: [account]
      summary: Alert settings (M9)
      operationId: getAlertPreferences
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertPreferences" }
    patch:
      tags: [account]
      summary: Change alert settings (M9)
      operationId: patchAlertPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                thresholdMinutes: { type: integer, minimum: 2, maximum: 1440 }
                emailEnabled: { type: boolean }
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertPreferences" }
        "400": { description: Bad value or nothing to update }

  /api/menus:
    get:
      tags: [media]
      summary: List menu boards (M10)
      operationId: listMenus
      responses:
        "200":
          description: Menus, newest edit first. available=false until migration 0007 is applied.
          content:
            application/json:
              schema:
                type: object
                properties:
                  available: { type: boolean }
                  menus: { type: array, items: { $ref: "#/components/schemas/MenuBoard" } }
    post:
      tags: [media]
      summary: Create a menu board from a template (M10)
      description: Renders a 1920x1080 PNG into the media library and creates a one-slide published playlist for it. Optional displayIds publish it right away.
      operationId: createMenu
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MenuInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  mediaId: { type: string, format: uuid }
                  playlistId: { type: string, format: uuid }
                  published: { type: boolean }
                  warning: { type: string }
        "400": { description: Validation error }
        "429": { description: Upload rate limit }
        "503": { description: Migration 0007 not applied }
  /api/menus/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [media]
      summary: One menu board (M10)
      operationId: getMenu
      responses:
        "200": { description: Menu, content: { application/json: { schema: { $ref: "#/components/schemas/MenuBoard" } } } }
        "404": { description: Not found or another account's }
    patch:
      tags: [media]
      summary: Edit a menu board (M10)
      description: Any of name, template, content, displayIds. Renders a new image and swaps it in wherever the old one played (playlists, screens, schedules), then removes the old image.
      operationId: patchMenu
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MenuInput" }
      responses:
        "200": { description: Updated (id, mediaId, playlistId, published) }
        "400": { description: Validation error }
        "404": { description: Not found }
    delete:
      tags: [media]
      summary: Delete a menu board's editable copy (M10)
      description: The last image and its playlist stay, so no screen goes blank.
      operationId: deleteMenu
      responses:
        "200": { description: Deleted }
        "404": { description: Not found }
  /api/menus/preview:
    post:
      tags: [media]
      summary: Render a preview PNG without saving (M10)
      operationId: previewMenu
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template, content]
              properties:
                template: { type: string, enum: [classic, fresh, bold] }
                content: { $ref: "#/components/schemas/MenuContent" }
      responses:
        "200": { description: PNG image, content: { image/png: { schema: { type: string, format: binary } } } }
        "400": { description: Validation error }
        "404": { description: Photo is not in this account's media }
  /api/brand:
    get:
      tags: [media]
      summary: The account's brand kit (M11)
      description: Logo and colours used on menu boards with useBrand true. `custom` is false until saved; `available` is false before migration 0008.
      operationId: getBrand
      responses:
        "200": { description: Brand, content: { application/json: { schema: { $ref: "#/components/schemas/Brand" } } } }
    put:
      tags: [media]
      summary: Save the logo and colours (M11)
      description: The logo must be a PNG or JPEG in this account's media. Existing menus change only after POST /api/brand/apply.
      operationId: putBrand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [primaryColor, accentColor]
              properties:
                primaryColor: { type: string, example: "#c8102e", description: "#rgb or #rrggbb" }
                accentColor: { type: string, example: "#ffffff" }
                logoMediaId: { type: string, format: uuid, nullable: true }
      responses:
        "200": { description: Saved, content: { application/json: { schema: { $ref: "#/components/schemas/Brand" } } } }
        "400": { description: Bad colour or unsupported logo format (use PNG or JPEG) }
        "404": { description: Logo not in this account's media }
        "503": { description: Branding not yet available }
  /api/brand/apply:
    post:
      tags: [media]
      summary: Re-render menus with the current brand, 8 at a time (M11)
      description: Menus with useBrand false are skipped. Call again with `after` = `next` until `next` is null. Screens update like a normal menu edit.
      operationId: applyBrand
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { after: { type: string, format: uuid } } }
      responses:
        "200":
          description: Batch result
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: integer }
                  skipped: { type: integer }
                  failed: { type: integer }
                  next: { type: string, format: uuid, nullable: true }
  /api/schedules/day-parts:
    post:
      tags: [schedules]
      summary: Breakfast / lunch / dinner in one step (M10)
      description: Creates one ordinary schedule rule per part (priority 10, every day unless weekdays given). All-or-nothing validation.
      operationId: createDayParts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parts]
              properties:
                displayId: { type: string, format: uuid }
                groupId: { type: string, format: uuid }
                weekdays: { type: array, items: { type: integer, minimum: 1, maximum: 7 } }
                parts:
                  type: array
                  minItems: 1
                  maxItems: 6
                  items:
                    type: object
                    required: [name, startTime, endTime]
                    properties:
                      name: { type: string }
                      startTime: { type: string, example: "06:00" }
                      endTime: { type: string, example: "11:00" }
                      menuId: { type: string, format: uuid }
                      playlistId: { type: string, format: uuid }
      responses:
        "201": { description: Created, content: { application/json: { schema: { type: object, properties: { ids: { type: array, items: { type: string } } } } } } }
        "400": { description: Validation error }
        "404": { description: Screen, group, menu, or playlist not found }

  /api/overview:
    get:
      tags: [account]
      summary: Dashboard counts for this account
      description: |
        Active screens only (revoked screens are omitted), matching
        `GET /api/displays`. `online` uses the same 60 second `last_seen_at`
        window. `offline` is `screens - online`, including screens that have
        never polled. `activeSchedules` counts enabled rules only.
        `playlists` counts every playlist, draft or published. No signed URLs
        and no row payloads.
      operationId: getOverview
      responses:
        "200":
          description: Counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Overview" }
              example:
                screens: 2
                online: 1
                offline: 1
                media: 4
                playlists: 1
                activeSchedules: 1
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500":
          description: A count failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "Couldn't load the overview." }

  /api/media:
    get:
      tags: [media]
      summary: Library
      description: |
        Newest first. Signed URLs expire after 3600 seconds. `kind` null in
        the database is returned as `image`. `usedIn` lists playlists that
        reference the file on a draft or published slide (Phase 2C). A failed
        usage lookup yields an empty `usedIn` rather than an error.
      operationId: listMedia
      responses:
        "200":
          description: Media rows
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MediaItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500":
          description: Read failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "Couldn't load images." }
    post:
      tags: [media]
      summary: Upload an image through the function
      description: |
        Multipart body. The server sniffs bytes with `checkImage` and ignores
        the browser Content-Type. JPG, PNG, or WebP, at most 15 MB, each edge
        at most 7680, at most 7680×4320 pixels. The website resizes to a JPEG
        under 4 MB first because Vercel rejects request bodies over about 4.5 MB.
        A 413 from the platform may have an empty body; the website maps any
        413 to "That image is too large to upload."
      operationId: uploadImage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Image bytes. Field name `file`.
                name:
                  type: string
                  description: |
                    Original file name. Control characters stripped, trimmed,
                    sliced to 200. Empty becomes `image`.
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Id" }
        "400":
          description: Missing file or empty body
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "Upload a JPG, PNG, or WebP image." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413":
          description: Over 15 MB (app) or over the platform body limit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "Images must be 15 MB or smaller." }
        "415":
          description: Not a JPEG, PNG, or WebP, or dimensions are too large
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                type: { value: { error: "That file isn't a JPG, PNG, or WebP image." } }
                dimensions: { value: { error: "That image is too large. Use 7680×4320 or smaller." } }
        "500":
          description: Storage or insert failed. A failed insert removes the object.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "Upload failed. Try again." }
        "429": { $ref: "#/components/responses/UploadLimited" }

  /api/media/upload:
    post:
      tags: [media]
      summary: Mint a signed video upload URL
      description: |
        Service role calls `createSignedUploadUrl` for `{accountId}/{mediaId}.mp4`.
        The bytes must not be posted to this route. The URL is a capability for
        about 2 hours (Supabase default; this route does not pass an expiry).
        PUT it as multipart: header `x-upsert: false`, field `cacheControl` =
        `86400`, and a file part with an empty name and filename `video.mp4`
        (`uploadToSignedUrl` in `lib/prepare-video.ts`).
      operationId: createVideoUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fileName: { type: string, description: Ignored by this route. The complete route stores the name. }
                sizeBytes:
                  type: number
                  description: Finite byte length, 1 through 52428800.
      responses:
        "201":
          description: Signed upload
          content:
            application/json:
              schema:
                type: object
                required: [mediaId, path, token, signedUrl]
                properties:
                  mediaId: { type: string, format: uuid }
                  path: { type: string, example: "account-uuid/media-uuid.mp4" }
                  token: { type: string }
                  signedUrl: { type: string, format: uri }
        "400":
          description: sizeBytes missing or not a positive finite number
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "That file isn't an H.264 MP4. Export it as MP4 with H.264 video and AAC audio, or with no audio." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413":
          description: Over 50 MB
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "Videos must be 50 MB or smaller." }
        "500":
          description: Could not mint the URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "Couldn't start the upload. Try again." }
        "429": { $ref: "#/components/responses/UploadLimited" }
        "503": { $ref: "#/components/responses/VideoUnavailable" }

  /api/media/upload/complete:
    post:
      tags: [media]
      summary: Validate a direct video upload and insert the library row
      description: |
        Downloads `{accountId}/{mediaId}.mp4`, runs `inspectMp4` and
        `enforceVideoLimits`, stores a JPEG thumbnail, and inserts `media`.
        The row's duration, width, and height come from the MP4, not from the
        body. The body values are a pre-check only. Retrying is safe and does
        not create a second row. If the row already exists, returns 200 `{id}`
        and does not re-read the object. If the thumbnail is already stored
        and the row is not, the route keeps that thumbnail and inserts the
        row (201). A caller that loses the insert to a concurrent complete
        gets 200 and leaves both objects in place. A failed check deletes the
        MP4 and a thumbnail at the same id, unless a row for this account was
        saved while this call was running, in which case the route returns
        200 and does not delete. A thumbnail upload that fails for a reason
        other than "already exists" also deletes the MP4 and thumbnail when
        no row was saved. The route allows 300 seconds, which covers
        downloading and checking a 50 MB object.
      operationId: completeVideoUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mediaId, durationMs, width, height, thumbnailBase64]
              properties:
                mediaId: { type: string, format: uuid }
                fileName: { type: string }
                durationMs: { type: integer, minimum: 1, description: Pre-check. Rejected above 180000. }
                width: { type: integer, minimum: 1, description: Pre-check. Rejected above 1920. }
                height: { type: integer, minimum: 1, description: Pre-check. Rejected above 1920. }
                thumbnailBase64:
                  type: string
                  description: |
                    JPEG, optionally prefixed with `data:image/jpeg;base64,`.
                    Decoded size 4 through 200000 bytes. Magic bytes FF D8 FF.
      responses:
        "200":
          description: |
            The row already existed, or another complete inserted it while
            this call was running. Body is `{id}`. Objects are left in place.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Id" }
        "201":
          description: |
            Inserted. Also returned when the thumbnail was already stored and
            this call created the single row.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Id" }
        "400":
          description: mediaId is not a UUID, or the object is not in storage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "Upload didn't arrive. Try again." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413":
          description: |
            Stored object is over 50 MB. The MP4 and a thumbnail at the same id
            are deleted, unless a row for this account was saved while this
            call was running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "Videos must be 50 MB or smaller." }
        "415":
          description: |
            Codec, profile, duration, dimensions, metadata, or thumbnail rejected.
            The MP4 and a thumbnail at the same id are deleted, unless a row
            for this account was saved while this call was running. Messages
            come from `mp4ErrorMessage` or the thumbnail checks.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                unreadable: { value: { error: "This browser couldn't read that video. Export it as H.264 MP4." } }
                duration: { value: { error: "Videos must be 3 minutes or shorter." } }
                dimensions: { value: { error: "Videos must be 1920×1920 or smaller." } }
                profile: { value: { error: "Use H.264 Baseline, Main, or High profile at level 4.2 or below. High 10, 4:2:2, and 4:4:4 are not supported." } }
                codec: { value: { error: "This video isn't H.264 with AAC audio (or no audio). HEVC, VP9, and AV1 can't play on these TVs." } }
                metadata: { value: { error: "This MP4's metadata is too large to check. Re-export a smaller file." } }
                type: { value: { error: "That file isn't an H.264 MP4. Export it as MP4 with H.264 video and AAC audio, or with no audio." } }
                thumb: { value: { error: "Couldn't save the preview image for that video. Try again." } }
        "500":
          description: |
            Thumbnail upload or insert failed, and this account has no row.
            The MP4 and thumbnail are removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "Couldn't save that video. Try again." }
        "429": { $ref: "#/components/responses/UploadLimited" }
        "503": { $ref: "#/components/responses/VideoUnavailable" }

  /api/media/{id}:
    delete:
      tags: [media]
      summary: Delete a library file
      description: |
        409 while any `playlist_items` row (draft or published) still points at
        the file. The message names those playlists. Otherwise `delete_media`
        clears displays that showed it, bumps their `content_version`, deletes
        the row, and the route removes the object and a same-account thumbnail.
      operationId: deleteMedia
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Id is not a UUID, or no row in this account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "File not found." }
        "409":
          description: Still used by a playlist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example:
                error: "This file is in a playlist (Lunch loop). Remove it from the playlist and publish again before deleting it."
        "500":
          description: Lookup or delete failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "Couldn't delete. Try again." }

  /api/displays:
    get:
      tags: [displays]
      summary: Active screens
      description: |
        `status = active`, oldest first. `connected` is true when `token_hash`
        is set. The hash is not returned. `online` is true when `lastSeenAt`
        is within 60000 ms. Signed media and playlist URLs expire after 3600
        seconds. Playlist URL is the first published slide (a video uses its
        thumbnail).
      operationId: listDisplays
      responses:
        "200":
          description: Screens
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Display" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500":
          description: Read failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "Couldn't load displays." }

  /api/displays/pair:
    post:
      tags: [displays]
      summary: Claim the code shown on a TV
      description: |
        HMAC-hashes the code with `PAIRING_CODE_SECRET` and calls `claim_pairing`.
        Counts the attempt before the lookup: 10 per user and 30 per IP per
        15 minutes. A blank code is 400 and does not count. Creates a display
        with no token. The TV collects the token on its own poll.
      operationId: claimPairing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code:
                  type: string
                  description: Non-digits are stripped. Exactly 6 digits must remain.
                  example: "123 456"
                name:
                  type: string
                  description: Control characters stripped, trimmed, sliced to 60. Must be non-empty.
                  example: "Front counter"
      responses:
        "200":
          description: Display created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Id" }
        "400":
          description: Code or name rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                code: { value: { error: "Enter the 6-digit code shown on the TV." } }
                name: { value: { error: "Give this TV a name, like “Front counter”." } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No pending unexpired session for that code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "That code doesn't match a TV. Check the screen — codes expire after 10 minutes." }
        "429":
          description: Claim rate limit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "Too many attempts. Wait 15 minutes, then try again." }
        "500":
          description: claim_pairing failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "Couldn't connect the TV. Try again." }

  /api/displays/{id}:
    patch:
      tags: [displays]
      summary: Rename a screen or assign a single image
      description: |
        If the JSON object has `mediaId`, that branch runs (`null` clears the
        screen) and `name` is ignored. `assign_media` refuses video, requires
        the image and an active display in this account, clears
        `assigned_playlist_id`, and increments `content_version`. Otherwise a
        string `name` is trimmed and sliced to 60. Phase 2D also accepts
        `locationId` (an active location in this account) in that same branch,
        alone or with `name`. `locationId: null` clears the location. The
        screen then uses the existing UTC fallback. `mediaId` still wins and
        ignores both. Any other body is 400.
      operationId: updateDisplay
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [mediaId]
                  properties:
                    mediaId:
                      type: string
                      format: uuid
                      nullable: true
                - type: object
                  properties:
                    name: { type: string }
                    locationId:
                      type: string
                      format: uuid
                      nullable: true
                      description: An active location in this account. Null clears it.
                  description: At least one of name or locationId.
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "400":
          description: Empty name, video assignment, or neither field
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                empty: { value: { error: "Name can't be empty." } }
                video: { value: { error: "Publish a video from a playlist. A single screen assignment has to be an image." } }
                none: { value: { error: "Nothing to update." } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Bad id, or the display or image is not in this account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                display: { value: { error: "Display not found." } }
                image: { value: { error: "Image not found." } }
                either: { value: { error: "Display or image not found." } }
                location: { value: { error: "Location not found." } }
        "500":
          description: Update failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                publish: { value: { error: "Couldn't publish. Try again." } }
                rename: { value: { error: "Couldn't rename. Try again." } }
                move: { value: { error: "Couldn't move the screen. Try again." } }
    delete:
      tags: [displays]
      summary: Disconnect a screen
      description: |
        Sets `status` to `revoked` and `token_hash` to null. The TV's next
        `GET /api/player/state` is 401 and the player returns to pairing.
        The row is kept and disappears from `GET /api/displays`.
      operationId: disconnectDisplay
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Not a UUID or not in this account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "Display not found." }
        "500":
          description: Update failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "Couldn't disconnect. Try again." }

  /api/playlists:
    get:
      tags: [playlists]
      summary: Playlist summaries
      description: |
        Newest `updated_at` first. `slideCount` counts draft items.
        `displayCount` and `displayNames` are active displays assigned to the
        playlist. `displayNames` order follows the displays query (not sorted).
        `thumbnailUrl` is the draft slide with the lowest position, signed for
        3600 seconds. A video at that position uses its thumbnail. Null when
        the draft is empty.
      operationId: listPlaylists
      responses:
        "200":
          description: Summaries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PlaylistSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500":
          description: Read failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "Couldn't load playlists." }
        "503": { $ref: "#/components/responses/PlaylistsUnavailable" }
    post:
      tags: [playlists]
      summary: Create an empty playlist
      description: |
        Inserts a draft with `default_duration_ms` 10000, `transition` `none`,
        and `revision` 0. Does not publish.
      operationId: createPlaylist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: Control characters stripped, trimmed, sliced to 80. Must be non-empty.
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Id" }
        "400":
          description: Empty name
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "Give the playlist a name." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500":
          description: Insert failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "Couldn't create the playlist." }
        "503": { $ref: "#/components/responses/PlaylistsUnavailable" }

  /api/playlists/{id}:
    get:
      tags: [playlists]
      summary: Draft editor payload
      description: |
        Draft items only, by position. Signed file and thumbnail URLs last
        3600 seconds. `displays` is every active screen, with `assigned` true
        when `assigned_playlist_id` is this playlist. Published slide rows are
        not included; `publishedAt`, `publishedTransition`, and `revision`
        describe the last publish.
      operationId: getPlaylist
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Not a UUID or not in this account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "Playlist not found." }
        "500":
          description: Read failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "Couldn't load the playlist." }
        "503": { $ref: "#/components/responses/PlaylistsUnavailable" }
    patch:
      tags: [playlists]
      summary: Replace the draft
      description: |
        Calls `save_playlist`. Does not change published items, `revision`,
        or any screen. Last write wins. `durationMs` null is stored null and
        resolved to the playlist default at publish. The website sends null
        for every video slide.
      operationId: savePlaylist
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaylistDraft" }
      responses:
        "200":
          description: Draft replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "400":
          description: Validation failed, or a media id is not in this account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                name: { value: { error: "Give the playlist a name." } }
                transition: { value: { error: "Choose a transition." } }
                durationType: { value: { error: "Set a default duration in seconds." } }
                durationRange: { value: { error: "Default duration must be between 1 and 600 seconds." } }
                items: { value: { error: "Check the slides and try again." } }
                missing: { value: { error: "Couldn't save the playlist. Check that the images are still in your library." } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Id is not a UUID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "Playlist not found." }
        "500":
          description: save_playlist failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "Couldn't save the playlist." }
        "503": { $ref: "#/components/responses/PlaylistsUnavailable" }
    delete:
      tags: [playlists]
      summary: Delete a playlist
      description: |
        `delete_playlist` clears `assigned_playlist_id` on screens that were
        playing it, bumps their `content_version`, then deletes the playlist.
        Items cascade. Those screens show no content on the next poll.
      operationId: deletePlaylist
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Not a UUID or not in this account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "Playlist not found." }
        "500":
          description: delete_playlist failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "Couldn't delete the playlist." }
        "503": { $ref: "#/components/responses/PlaylistsUnavailable" }

  /api/playlists/{id}/publish:
    post:
      tags: [playlists]
      summary: Publish the saved draft to screens
      description: |
        `publish_playlist` copies draft items to `kind = published` with
        duration `coalesce(slide, default)`, sets `published_at` and
        `published_transition`, increments `revision`, assigns the listed
        active displays (clearing `assigned_media_id` and bumping
        `content_version`), and unassigns active displays that had this
        playlist and were omitted. The draft must contain at least one item.
        Unsaved editor state is not read; call PATCH first.
      operationId: publishPlaylist
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayIds]
              properties:
                displayIds:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "400":
          description: Display list rejected, empty draft, or a display is not active in this account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                choose: { value: { error: "Choose at least one TV." } }
                empty: { value: { error: "Add at least one image, then choose TVs from this account." } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Id is not a UUID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "Playlist not found." }
        "500":
          description: publish_playlist failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "Couldn't publish the playlist." }
        "429": { $ref: "#/components/responses/PublishLimited" }
        "503": { $ref: "#/components/responses/PlaylistsUnavailable" }

  /api/locations:
    get:
      tags: [locations]
      summary: Locations in this account
      operationId: listLocations
      description: |
        Oldest first. `displayCount` counts active screens. `timezone` is an
        IANA name. Before migration 0004 the column is missing and the route
        returns `UTC` for every location. Writes that need the column return 503.
      responses:
        "200":
          description: Locations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Location" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500":
          description: Read failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "Couldn't load locations." }
    post:
      tags: [locations]
      summary: Create a location
      operationId: createLocation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, description: Trimmed, sliced to 80. }
                timezone:
                  type: string
                  description: IANA name. Omitted means UTC.
                  example: America/Los_Angeles
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Id" }
        "400":
          description: Empty name, unknown timezone, or 50 locations already
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                name: { value: { error: "Give this location a name." } }
                zone: { value: { error: "That timezone isn't an IANA name like America/Los_Angeles." } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/CreateLimited" }
        "503":
          description: Migration 0004 is not applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "Schedules aren't available yet. Apply migration 0004_scheduling.sql, then reload." }

  /api/locations/{id}:
    patch:
      tags: [locations]
      summary: Rename a location or set its timezone
      operationId: updateLocation
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                timezone: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "400":
          description: Empty name, bad timezone, or neither field
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Not in this account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "Location not found." }
        "503":
          description: Timezone column is missing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [locations]
      summary: Delete a location that has no active screens
      operationId: deleteLocation
      description: |
        Refuses while any active display uses the location. Revoked displays
        are detached (`location_id` set null) and the location row is deleted.
        Location rows and other columns are otherwise untouched.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Not in this account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "Location not found." }
        "409":
          description: An active screen still uses it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "That location still has screens. Move them first." }

  /api/screen-groups:
    get:
      tags: [groups]
      summary: Screen groups
      operationId: listScreenGroups
      responses:
        "200":
          description: Groups, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ScreenGroup" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503":
          description: Migration 0004 is not applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "Schedules aren't available yet. Apply migration 0004_scheduling.sql, then reload." }
    post:
      tags: [groups]
      summary: Create a screen group
      operationId: createScreenGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                displayIds:
                  type: array
                  maxItems: 100
                  items: { type: string, format: uuid }
                  description: Active displays in this account. Omitted means an empty group.
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Id" }
        "400":
          description: Empty name or a screen that is not active in this account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: Name already used in this account, case-insensitive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "A group with that name already exists." }
        "429": { $ref: "#/components/responses/CreateLimited" }
        "503":
          description: Migration 0004 is not applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/screen-groups/{id}:
    patch:
      tags: [groups]
      summary: Rename a group or replace its screens
      operationId: updateScreenGroup
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                displayIds:
                  type: array
                  items: { type: string, format: uuid }
                  description: Replaces the membership when present.
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "400":
          description: Bad name or a screen that is not active in this account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Not in this account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "Screen group not found." }
        "409":
          description: Name already used
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [groups]
      summary: Delete a screen group
      operationId: deleteScreenGroup
      description: Membership rows and schedules that target the group are deleted with it.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Not in this account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "Screen group not found." }

  /api/schedules:
    get:
      tags: [schedules]
      summary: Schedule rules
      operationId: listSchedules
      description: Newest `updated_at` first. Includes paused rules.
      responses:
        "200":
          description: Rules
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Schedule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503":
          description: Migration 0004 is not applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "Schedules aren't available yet. Apply migration 0004_scheduling.sql, then reload." }
    post:
      tags: [schedules]
      summary: Create a schedule rule
      operationId: createSchedule
      description: |
        Exactly one of `displayId` or `groupId`. Weekdays are ISO numbers,
        1 Monday through 7 Sunday. `startTime` and `endTime` are `HH:MM` in the
        screen's location timezone. `24:00` is allowed only as an end. An end
        earlier than the start crosses midnight and continues into the next
        morning. The playlist must already have published slides. Publish with
        `POST /api/playlists/{id}/publish` (assigns screens) or
        `POST /api/playlists/{id}/snapshot` (does not assign screens).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Id" }
        "400":
          description: Invalid window, or the playlist has no published slides
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                unpublished: { value: { error: "Publish that playlist before scheduling it. Screens play its published slides, and publishing slides does not have to assign the playlist as the everyday default." } }
                window: { value: { error: "The start and end are the same. A window has to cover some time." } }
                weekdays: { value: { error: "Pick at least one weekday." } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Playlist, screen, or group is not in this account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/CreateLimited" }
        "503":
          description: Migration 0004 is not applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/schedules/preview:
    get:
      tags: [schedules]
      summary: What plays on one screen over the next several days
      operationId: previewSchedule
      parameters:
        - name: displayId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 14, default: 7 }
      responses:
        "200":
          description: Timeline in the screen's location timezone
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchedulePreview" }
        "400":
          description: days is outside 1 to 14
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "Preview covers 1 to 14 days." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Display is not an active screen in this account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "Display not found." }
        "503":
          description: Migration 0004 is not applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/schedules/{id}:
    patch:
      tags: [schedules]
      summary: Update a schedule rule
      operationId: updateSchedule
      description: |
        Send the fields to change. The stored rule is filled in for the rest
        and checked again. `enabled: false` pauses the rule without deleting it.
        `updated_at` changes, which matters when two rules tie on priority.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "400":
          description: The merged rule is not a valid window
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Not in this account, or the new target is not
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "Schedule not found." }
    delete:
      tags: [schedules]
      summary: Delete a schedule rule
      operationId: deleteSchedule
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Not in this account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "Schedule not found." }

  /api/playlists/{id}/snapshot:
    post:
      tags: [playlists]
      summary: Publish slides without assigning screens
      operationId: snapshotPlaylist
      description: |
        Copies the draft into the published snapshot and increments `revision`.
        Does not assign or clear displays. Active displays already assigned
        this playlist get a `content_version` bump so they reload. A schedule
        plays this snapshot. `POST /api/playlists/{id}/publish` is unchanged
        and still assigns the screens in `displayIds`.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Snapshot stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "400":
          description: The draft has no slides, or the playlist is missing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "Add at least one slide, then publish the slides." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Not a UUID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "Playlist not found." }
        "429": { $ref: "#/components/responses/PublishLimited" }
        "503":
          description: Playlists or snapshot_playlist are missing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/player/pair:
    post:
      tags: [player]
      summary: TV asks for a pairing code
      security: []
      description: |
        TV only. Unauthenticated. 30 requests per IP per hour. Inserts a
        pending session (code HMAC, secret SHA-256, 600 second TTL) and
        returns the raw code and secret once.
      operationId: createPairingCode
      responses:
        "200":
          description: Code minted
          content:
            application/json:
              schema:
                type: object
                required: [sessionId, code, secret, expiresInSeconds]
                properties:
                  sessionId: { type: string, format: uuid }
                  code: { type: string, pattern: "^[0-9]{6}$" }
                  secret: { type: string }
                  expiresInSeconds: { type: integer, example: 600 }
        "429":
          description: Create rate limit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "Too many pairing requests. Try again later." }
        "500":
          description: Insert failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "Couldn't create a pairing code." }

  /api/player/pair/status:
    post:
      tags: [player]
      summary: TV polls to collect its display token
      security: []
      description: |
        TV only. Returns `paired` and the raw token once, when the session
        is `claimed` and the secret matches. The token is then stored only as
        SHA-256 on the display. A second poll, a bad secret, or an unknown
        session is `{ "status": "expired" }` with HTTP 200.
      operationId: pollPairing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, secret]
              properties:
                sessionId: { type: string, format: uuid }
                secret: { type: string, minLength: 20 }
      responses:
        "200":
          description: Always 200. Branch on `status`.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [pending, expired, paired]
                  token:
                    type: string
                    description: Present only when status is paired.

  /api/player/state:
    get:
      tags: [player]
      summary: TV heartbeat and content
      security:
        - displayToken: []
      description: |
        TV only. Header `X-Display-Token` (length 20–200). `player_state`
        writes `last_seen_at` at most once every 30 seconds. Query `v` is the
        content version the TV is showing. When it matches, the body is
        `{ version, unchanged: true }` and no signed URL is minted.
        `refresh=1` forces a playlist URL refresh even when the version matches.
        A single assigned image never includes `playlist`. Signed URLs last
        3600 seconds.

        Phase 2D resolves schedules on the server during this poll. The player
        file is unchanged. If no enabled rule targets the display, the JSON is
        the same as before, including `version` equal to `content_version`.
        If rules exist, `version` stays `content_version` while the saved
        assignment is showing and becomes a stable playback version while a
        rule is active (rule id, playlist id, and published revision). That
        version changes when the winner changes, so the TV picks up the
        transition on its next poll (or right after `nextTransitionAt`), without a reload.
        `nextTransitionAt` is added only when a rule targets the display and
        the winner changes within 8 days. An active rule plays that playlist's
        published slides and overrides a single assigned image. An empty
        published playlist shows nothing until the window ends. It does not
        fall through to the saved assignment.

        Milestone B: every 200 body also carries `pollMs`, the interval the
        server asks the TV to poll at (default 30000, set by `PLAYER_POLL_MS`,
        clamped 5000–120000). Players older than this field ignore it and keep
        polling every 10 seconds. The current player also polls just after
        `nextTransitionAt`, so schedule switches stay on time.
      operationId: playerState
      parameters:
        - name: v
          in: query
          schema: { type: string }
          description: Content version currently on screen. Empty on the first poll.
        - name: refresh
          in: query
          schema: { type: string, enum: ["1"] }
          description: Re-sign playlist URLs even when `v` matches.
        - name: _
          in: query
          schema: { type: string }
          description: Cache buster sent by the player. Ignored.
      responses:
        "200":
          description: State
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [version, unchanged]
                    properties:
                      version:
                        type: integer
                        description: content_version, or a playback version above 1000000000000 while a schedule rule is active.
                      unchanged: { type: boolean, enum: [true] }
                      pollMs:
                        type: integer
                        minimum: 5000
                        maximum: 120000
                        description: How often the TV should poll, in milliseconds. Default 30000.
                      nextTransitionAt:
                        type: string
                        format: date-time
                        description: Present only when a schedule targets this screen and the winner changes within 8 days.
                  - type: object
                    required: [version, mediaId, url]
                    properties:
                      version:
                        type: integer
                        description: content_version, or a playback version above 1000000000000 while a schedule rule is active.
                      mediaId: { type: string, format: uuid, nullable: true }
                      url: { type: string, format: uri, nullable: true }
                      playlist: { $ref: "#/components/schemas/PlayerPlaylist" }
                      pollMs:
                        type: integer
                        minimum: 5000
                        maximum: 120000
                        description: How often the TV should poll, in milliseconds. Default 30000.
                      nextTransitionAt:
                        type: string
                        format: date-time
                        description: Present only when a schedule targets this screen and the winner changes within 8 days.
        "401":
          description: Missing, malformed, or revoked token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: unauthorized }
        "503":
          description: player_state or signing failed. The TV keeps the last picture.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: unavailable }
    post:
      tags: [player]
      summary: TV reports a clip it could not play, or confirms what it painted
      security:
        - displayToken: []
      description: |
        TV only. Empty or missing `error` clears `player_error`. Otherwise the
        text is trimmed and sliced to 180 characters. Before migration 0003
        this is a no-op 200.

        M8 proof of play: a body of `{ "playing": { "version": N } }` (safe
        integer >= 0) is handled separately and never touches `player_error`.
        Send it once after the TV has actually painted content version N.
        Stores `confirmed_version`/`confirmed_at` (refreshed at most hourly
        for the same version) and adds a `playback_events` row when the
        version changes. 400 for a bad version; 200 no-op before migration 0005.
      operationId: reportPlayerError
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                error: { type: string, nullable: true }
                playing:
                  type: object
                  required: [version]
                  properties:
                    version: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Recorded, or ignored because the column is missing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "401":
          description: Token does not match an active display
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: unauthorized }
        "503":
          description: report_player_error failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: unavailable }

  /api/cron/orphan-uploads:
    get:
      tags: [ops]
      summary: Delete orphaned upload objects older than 24 hours
      operationId: cleanupOrphanUploads
      security: []
      description: |
        Not for the mobile app. Vercel Cron calls this once a day
        (`0 7 * * *` in vercel.json; Hobby allows a daily job) with
        `Authorization: Bearer <CRON_SECRET>`.

        Lists objects in the private `media` bucket. Deletes a file only when
        it is older than 24 hours and no `media` row has that path as
        `storage_path` or `thumbnail_path`. That covers a signed upload that
        never completed, and a thumbnail left without a row. A missing or
        unparseable `created_at` is kept. If `CRON_SECRET` is unset the route
        returns 503 and deletes nothing. If listing or reading `media` fails,
        it deletes nothing.

        `dryRun=1` or `dryRun=true` logs each path it would delete and does
        not remove objects.
      parameters:
        - name: dryRun
          in: query
          required: false
          schema: { type: string, enum: ["1", "true"] }
          description: Log the paths that would be deleted and delete nothing.
      responses:
        "200":
          description: Scan finished. `deleted` is empty when `dryRun` is true.
          content:
            application/json:
              schema:
                type: object
                required: [ok, dryRun, scanned, deleted, wouldDelete, truncated]
                properties:
                  ok: { type: boolean, enum: [true] }
                  dryRun: { type: boolean }
                  scanned: { type: integer, description: File objects seen. Folders are not counted. }
                  deleted:
                    type: array
                    items: { type: string }
                    description: Paths removed. Empty on a dry run.
                  wouldDelete:
                    type: array
                    items: { type: string }
                    description: Paths that were eligible after the media-row check.
                  truncated: { type: boolean, description: True when a folder page cap stopped the walk. }
        "401":
          description: CRON_SECRET is set and the Bearer token does not match
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "Unauthorized." }
        "500":
          description: Listing or deletion failed. Objects that still have a media row were not removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "Couldn't clean up uploads." }
        "503":
          description: CRON_SECRET is unset. Nothing is listed or deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "Cleanup isn't configured." }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth access token. Not a display token.
    displayToken:
      type: apiKey
      in: header
      name: X-Display-Token
      description: Raw display token from pairing. TV only.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Unauthorized:
      description: Missing or rejected Supabase access token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "Sign in to continue." }
    PlaylistsUnavailable:
      description: Migration 0002 is not applied
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "Playlists aren't available yet. Apply migration 0002_playlists.sql, then reload." }
    VideoUnavailable:
      description: Migration 0003 is not applied
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "Video isn't available yet. Apply migration 0003_video.sql, then reload." }
    UploadLimited:
      description: |
        60 requests per user per 15 minutes for this route. Image upload,
        video upload init, and video upload complete each have their own
        counter. Counted only after the body is accepted (an image must also
        pass the byte check). `Retry-After` is the seconds left in the window.
      headers:
        Retry-After:
          description: Seconds until the window ends.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "Too many uploads. Wait 15 minutes, then try again." }
    PublishLimited:
      description: |
        60 requests per user per 15 minutes for this route. Publish and
        snapshot do not share a counter. Counted only after the id and, for
        publish, `displayIds` are accepted.
      headers:
        Retry-After:
          description: Seconds until the window ends.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "Too many publishes. Wait 15 minutes, then try again." }
    CreateLimited:
      description: |
        Per user per 15 minutes, and above the account cap, so filling
        locations (80 vs 50), screen groups (150 vs 100), or schedules
        (240 vs 200) does not return 429. Each create route has its own
        counter. Counted only after the body parses. The message names the
        resource. `Retry-After` is the seconds left in the window.
      headers:
        Retry-After:
          description: Seconds until the window ends.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            location: { value: { error: "Too many locations. Wait 15 minutes, then try again." } }
            group: { value: { error: "Too many screen groups. Wait 15 minutes, then try again." } }
            schedule: { value: { error: "Too many schedules. Wait 15 minutes, then try again." } }
  schemas:
    Brand:
      type: object
      properties:
        primaryColor: { type: string }
        accentColor: { type: string }
        logoMediaId: { type: string, format: uuid, nullable: true }
        custom: { type: boolean }
        available: { type: boolean }
    MenuContent:
      type: object
      properties:
        title: { type: string, maxLength: 40 }
        subtitle: { type: string, maxLength: 80 }
        footer: { type: string, maxLength: 80 }
        photoMediaId: { type: string, format: uuid, nullable: true, description: "M11. PNG or JPEG from this account's media, shown on the right." }
        useBrand: { type: boolean, default: true, description: "M11. Apply the account brand (logo, colours)." }
        sections:
          type: array
          maxItems: 4
          items:
            type: object
            properties:
              name: { type: string, maxLength: 30 }
              items:
                type: array
                maxItems: 12
                items:
                  type: object
                  properties:
                    name: { type: string, maxLength: 40 }
                    price: { type: string, maxLength: 12 }
                    description: { type: string, maxLength: 80 }
    MenuInput:
      type: object
      properties:
        name: { type: string, maxLength: 80 }
        template: { type: string, enum: [classic, fresh, bold] }
        content: { $ref: "#/components/schemas/MenuContent" }
        displayIds: { type: array, maxItems: 50, items: { type: string, format: uuid } }
    MenuBoard:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        template: { type: string, enum: [classic, fresh, bold] }
        content: { $ref: "#/components/schemas/MenuContent" }
        mediaId: { type: string, format: uuid, nullable: true }
        playlistId: { type: string, format: uuid, nullable: true }
        imageUrl: { type: string, nullable: true, description: Signed URL, 1 hour }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AlertPreferences:
      type: object
      properties:
        enabled: { type: boolean }
        thresholdMinutes: { type: integer }
        email:
          type: object
          properties:
            enabled: { type: boolean, description: The owner wants email }
            available: { type: boolean, description: Email delivery is configured on the server }
            address: { type: string }
        limits:
          type: object
          properties:
            minMinutes: { type: integer }
            maxMinutes: { type: integer }
    Onboarding:
      type: object
      required: [steps, completed, total, nextStep, dismissed, finished, show]
      properties:
        steps:
          type: array
          items:
            type: object
            properties:
              id: { type: string, enum: [account, business, location, screen, media, playlist, publish, playing] }
              done: { type: boolean }
              confirmed: { type: boolean, description: Only on the playing step }
        completed: { type: integer }
        total: { type: integer }
        nextStep: { type: string, nullable: true }
        dismissed: { type: boolean }
        finished: { type: boolean }
        show: { type: boolean }
        firstLocationId: { type: string, nullable: true }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    Ok:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, enum: [true] }
    Id:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }
    Overview:
      type: object
      required: [screens, online, offline, media, playlists, activeSchedules]
      properties:
        screens: { type: integer, description: Active screens in this account. }
        online: { type: integer, description: Active screens seen within 60 seconds. }
        offline: { type: integer, description: Active screens that are not online. }
        media: { type: integer }
        playlists: { type: integer }
        activeSchedules: { type: integer, description: Enabled schedule rows. }
    MediaUse:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    MediaItem:
      type: object
      required: [id, fileName, sizeBytes, createdAt, url, kind, durationMs, width, height, thumbnailUrl, usedIn]
      properties:
        id: { type: string, format: uuid }
        fileName: { type: string }
        sizeBytes: { type: integer }
        createdAt: { type: string, format: date-time }
        url: { type: string, format: uri, nullable: true }
        kind: { type: string, enum: [image, video] }
        durationMs: { type: integer, nullable: true }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        thumbnailUrl: { type: string, format: uri, nullable: true }
        usedIn:
          type: array
          items: { $ref: "#/components/schemas/MediaUse" }
    DisplayMedia:
      type: object
      required: [id, fileName, url]
      properties:
        id: { type: string, format: uuid }
        fileName: { type: string }
        url: { type: string, format: uri, nullable: true }
    DisplayPlaylist:
      type: object
      required: [id, name, url]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        url: { type: string, format: uri, nullable: true }
    Display:
      type: object
      required: [id, name, connected, online, lastSeenAt, playerError, media, playlist]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        connected: { type: boolean }
        online: { type: boolean }
        lastSeenAt: { type: string, format: date-time, nullable: true }
        playerError: { type: string, nullable: true }
        location:
          allOf:
            - $ref: "#/components/schemas/LocationRef"
          nullable: true
          description: Phase 2D. Null when the screen has no location. Older clients ignore it.
        media:
          allOf:
            - $ref: "#/components/schemas/DisplayMedia"
          nullable: true
        playlist:
          allOf:
            - $ref: "#/components/schemas/DisplayPlaylist"
          nullable: true
        activeSchedules:
          type: array
          description: Milestone 3, additive. Enabled schedule rules matching this screen right now, winner first (screen rule > group rule > higher priority > most recently updated > lowest id). Empty when none.
          items: { $ref: "#/components/schemas/ScheduleSummary" }
        currentSchedule:
          description: Milestone 3, additive. The winning rule (what the TV plays now), or null when the saved assignment plays.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ScheduleSummary"
            - type: object
              required: [until]
              properties:
                until: { type: string, format: date-time, nullable: true, description: Next time what plays changes, if within 8 days. }
    ScheduleSummary:
      type: object
      required: [id, name, playlistId, playlistName, target, priority]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        playlistId: { type: string, format: uuid }
        playlistName: { type: string }
        target: { type: string, enum: [display, group] }
        priority: { type: integer }
    LocationRef:
      type: object
      required: [id, name, timezone]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        timezone: { type: string, description: IANA name. UTC until someone sets one. }
    Location:
      allOf:
        - $ref: "#/components/schemas/LocationRef"
        - type: object
          required: [displayCount]
          properties:
            displayCount: { type: integer, description: Active screens at this location. }
    ScreenGroup:
      type: object
      required: [id, name, displayIds, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        displayIds:
          type: array
          items: { type: string, format: uuid }
        updatedAt: { type: string, format: date-time }
    Schedule:
      type: object
      required: [id, name, playlistId, playlistName, displayId, displayName, groupId, groupName, weekdays, startTime, endTime, startsOn, endsOn, priority, enabled, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        playlistId: { type: string, format: uuid }
        playlistName: { type: string }
        displayId: { type: string, format: uuid, nullable: true }
        displayName: { type: string, nullable: true }
        groupId: { type: string, format: uuid, nullable: true }
        groupName: { type: string, nullable: true }
        weekdays:
          type: array
          items: { type: integer, minimum: 1, maximum: 7 }
          description: ISO weekdays. 1 is Monday, 7 is Sunday.
        startTime: { type: string, example: "11:00" }
        endTime: { type: string, example: "14:00", description: "24:00 is the end of the local day." }
        startsOn: { type: string, format: date, nullable: true }
        endsOn: { type: string, format: date, nullable: true }
        priority: { type: integer, minimum: -1000, maximum: 1000 }
        enabled: { type: boolean }
        updatedAt: { type: string, format: date-time }
    ScheduleInput:
      type: object
      properties:
        name: { type: string }
        playlistId: { type: string, format: uuid }
        displayId: { type: string, format: uuid, nullable: true }
        groupId: { type: string, format: uuid, nullable: true }
        weekdays:
          type: array
          items: { type: integer, minimum: 1, maximum: 7 }
        startTime: { type: string }
        endTime: { type: string }
        startsOn: { type: string, format: date, nullable: true }
        endsOn: { type: string, format: date, nullable: true }
        priority: { type: integer, minimum: -1000, maximum: 1000 }
        enabled: { type: boolean }
    SchedulePreview:
      type: object
      required: [displayId, timezone, from, until, resolution, defaultAssignment, segments]
      properties:
        displayId: { type: string, format: uuid }
        timezone: { type: string }
        from: { type: string, format: date-time }
        until: { type: string, format: date-time }
        resolution: { type: string }
        defaultAssignment:
          type: object
          required: [playlistId, playlistName, mediaId, mediaName]
          properties:
            playlistId: { type: string, format: uuid, nullable: true }
            playlistName: { type: string, nullable: true }
            mediaId: { type: string, format: uuid, nullable: true }
            mediaName: { type: string, nullable: true }
        segments:
          type: array
          items:
            type: object
            required: [start, end, date, source, scheduleId, scheduleName, playlistId, playlistName, target, priority]
            properties:
              start: { type: string, format: date-time }
              end: { type: string, format: date-time }
              date: { type: string, format: date, description: Local calendar date of the segment start. }
              source: { type: string, enum: [schedule, default] }
              scheduleId: { type: string, format: uuid, nullable: true }
              scheduleName: { type: string, nullable: true }
              playlistId: { type: string, format: uuid, nullable: true }
              playlistName: { type: string, nullable: true }
              target: { type: string, enum: [display, group], nullable: true }
              priority: { type: integer, nullable: true }
    PlaylistSummary:
      type: object
      required: [id, name, defaultDurationMs, transition, slideCount, displayCount, displayNames, thumbnailUrl, publishedAt, updatedAt, revision]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        defaultDurationMs: { type: integer }
        transition: { type: string, enum: [none, fade] }
        slideCount: { type: integer }
        displayCount: { type: integer }
        displayNames:
          type: array
          items: { type: string }
        thumbnailUrl: { type: string, format: uri, nullable: true }
        publishedAt: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time }
        revision: { type: integer }
    PlaylistItem:
      type: object
      required: [id, mediaId, fileName, url, thumbnailUrl, kind, mediaDurationMs, durationMs, position]
      properties:
        id: { type: string, format: uuid }
        mediaId: { type: string, format: uuid }
        fileName: { type: string }
        url: { type: string, format: uri, nullable: true }
        thumbnailUrl: { type: string, format: uri, nullable: true }
        kind: { type: string, enum: [image, video] }
        mediaDurationMs: { type: integer, nullable: true }
        durationMs: { type: integer, nullable: true, description: Null means the playlist default, resolved at publish. }
        position: { type: integer, minimum: 0, maximum: 39 }
    PlaylistDisplay:
      type: object
      required: [id, name, assigned]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        assigned: { type: boolean }
    PlaylistDetail:
      type: object
      required: [id, name, defaultDurationMs, transition, publishedAt, publishedTransition, revision, updatedAt, items, displays]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        defaultDurationMs: { type: integer }
        transition: { type: string, enum: [none, fade] }
        publishedAt: { type: string, format: date-time, nullable: true }
        publishedTransition: { type: string, enum: [none, fade], nullable: true }
        revision: { type: integer }
        updatedAt: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: "#/components/schemas/PlaylistItem" }
        displays:
          type: array
          items: { $ref: "#/components/schemas/PlaylistDisplay" }
    PlaylistDraft:
      type: object
      required: [name, transition, defaultDurationMs, items]
      properties:
        name: { type: string }
        transition: { type: string, enum: [none, fade] }
        defaultDurationMs: { type: integer, minimum: 1000, maximum: 600000 }
        items:
          type: array
          maxItems: 40
          items:
            type: object
            required: [mediaId, durationMs]
            properties:
              mediaId: { type: string, format: uuid }
              durationMs: { type: integer, minimum: 1000, maximum: 600000, nullable: true }
    PlayerPlaylistItem:
      type: object
      required: [mediaId, url, durationMs, kind, width, height]
      properties:
        mediaId: { type: string, format: uuid }
        url: { type: string, format: uri }
        durationMs: { type: integer }
        kind: { type: string, enum: [image, video] }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
    PlayerPlaylist:
      type: object
      required: [id, transition, items]
      properties:
        id: { type: string, format: uuid }
        transition: { type: string, enum: [none, fade] }
        items:
          type: array
          items: { $ref: "#/components/schemas/PlayerPlaylistItem" }
