<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pekko</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; color: #fff;
    overflow: hidden; cursor: none; font-family: Arial, Helvetica, sans-serif; }
  /* Background images with background-size:contain work on older TV browsers that lack object-fit. */
  .layer { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-color: #000;
    background-repeat: no-repeat; background-position: center center;
    -webkit-background-size: contain; background-size: contain; visibility: hidden; }
  .layer.on { visibility: visible; }
  .layer.fade { opacity: 0; -webkit-transition: opacity 0.6s linear; transition: opacity 0.6s linear; }
  .layer.fade.on { opacity: 1; }
  .stage { position: absolute; visibility: hidden; background: transparent; }
  .stage.on { visibility: visible; }
  .screen { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #000;
    display: none; z-index: 2000000; }
  .screen.on { display: block; }
  .center { position: absolute; top: 50%; left: 5%; right: 5%; text-align: center;
    -webkit-transform: translateY(-50%); transform: translateY(-50%); }
  .label { font-size: 34px; font-size: 4.4vh; color: #e3e8e6; line-height: 1.3; }
  .code { font-size: 170px; font-size: 22vh; font-weight: bold; letter-spacing: 0.06em;
    line-height: 1.1; margin: 3vh 0; color: #fff; }
  .muted { font-size: 24px; font-size: 3vh; color: #87918d; line-height: 1.4; }
  .status { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2500000; display: none;
    text-align: center; font-size: 22px; font-size: 2.6vh; padding: 1.6vh 0; color: #fff;
    background: rgba(0, 0, 0, 0.55); }
  .status.on { display: block; }
</style>
</head>
<body>
<div id="a" class="layer"></div>
<div id="b" class="layer"></div>
<video id="va" class="stage" muted playsinline webkit-playsinline preload="auto"></video>
<video id="vb" class="stage" muted playsinline webkit-playsinline preload="auto"></video>

<div id="pair" class="screen"><div class="center">
  <div class="label">Enter this code in Pekko to connect this TV.</div>
  <div id="code" class="code">&nbsp;</div>
  <div class="muted">A new code appears every 10 minutes.</div>
</div></div>

<div id="empty" class="screen"><div class="center">
  <div class="label">No content assigned</div>
  <div class="muted">Choose an image for this screen in your dashboard.</div>
</div></div>

<div id="connecting" class="screen"><div class="center">
  <div class="muted">Connecting&hellip;</div>
</div></div>
<div id="status" class="status"></div>

<script>
/* Plain ES5 only: Samsung Tizen and LG webOS browsers can be years behind. */
(function () {
  'use strict';
  var TOKEN_KEY = 'pantalla_display_token';
  var STATE_MS = 10000, PAIR_MS = 3000, RETRY_MS = 5000, LOAD_TIMEOUT_MS = 60000;

  function el(id) { return document.getElementById(id); }
  var layers = [el('a'), el('b')];
  var active = 0, z = 1;
  var mode = '', gen = 0, timer = null;
  var shownVersion = null, loadingVersion = null, preloadImg = null, hasImage = false;
  // Proof of play: the version actually painted, and the last one the server accepted.
  var paintedVersion = null, confirmedVersion = null, confirmBusy = false;
  var memToken = null;
  var playlist = null, slideIndex = 0, slideToken = 0, slideTimer = null;
  var loadedUrls = {}, needRefresh = false, urlRefreshAt = 0;
  var videos = [el('va'), el('vb')];
  var shownVideo = null, stableSrc = {}, badSkips = {}, badLevel = {}, watchTimer = null, attempt = 0, reportedError = false, skipBurst = 0;
  // Polling: the server may send pollMs (older servers do not; then STATE_MS stays).
  var pollMs = STATE_MS, wakeAt = 0;

  // ---- persistent media cache (only where the TV browser supports it; otherwise nothing changes)
  // Files are kept by mediaId, which never changes for an upload, so each file is
  // downloaded once and reused across loops, restarts and short outages.
  var CACHE_NAME = 'seemple-media-v1', LAST_KEY = 'seemple_last_state', INDEX_KEY = 'seemple_media_index';
  var CACHE_MAX_BYTES = 60 * 1024 * 1024, CACHE_KEEP_MS = 14 * 86400000;
  var blobs = {}, cacheQueue = [], cacheQueued = {}, cacheBusy = false, blobVideoBad = false, triedOffline = false;
  // Read-only map of saved files (mediaId -> local URL), for support and automated checks.
  try { window.seempleSavedMedia = blobs; } catch (eSaved) {}
  var canCache = (function () {
    try {
      return !!(window.caches && window.fetch && window.Promise && window.URL && window.URL.createObjectURL);
    } catch (e) { return false; }
  })();
  if (canCache) {
    try { if (window.navigator && window.navigator.storage && window.navigator.storage.persist) window.navigator.storage.persist(); } catch (e) {}

    try {
      if (window.navigator && window.navigator.serviceWorker && window.navigator.serviceWorker.register) {

  }
  function mediaKey(id) { return '/__seemple_media/' + encodeURIComponent(id); }

    if (d.playlist && d.playlist.items) {
      for (i = 0; i < d.playlist.items.length; i++) {
        it = d.playlist.items[i];
        if (it && it.mediaId && it.url) out.push({ mediaId: it.mediaId, url: it.url });
      }
    } else if (d.mediaId && d.url) {
      out.push({ mediaId: d.mediaId, url: d.url });

  function cacheMedia(d) {

      }
    }

        delete index[id];
        dropBlob(id);
        (function (gone) {
          window.caches.open(CACHE_NAME).then(function (c) { return c['delete'](mediaKey(gone)); }).then(null, function () {});
        })(id);
      }
    }
    writeJsonKey(INDEX_KEY, index);
    pumpCache();
  }
  function pumpCache() {
    var job;
    if (cacheBusy || !cacheQueue.length) return;
    job = cacheQueue.shift();
    cacheBusy = true;
    function next() { cacheBusy = false; delete cacheQueued[job.mediaId]; pumpCache(); }
    loadBlob(job.mediaId, function (have) {
      if (have) { next(); return; }
      var store;
      window.caches.open(CACHE_NAME).then(function (c) {
        store = c;
        return window.fetch(job.url, { mode: 'cors', credentials: 'omit' });
      }).then(function (r) {
        var size = Number(r && r.headers && r.headers.get ? r.headers.get('content-length') : 0) || 0;
        if (!r || !r.ok || size > CACHE_MAX_BYTES) return null;
        return store.put(mediaKey(job.mediaId), r);
      }).then(function () {
        loadBlob(job.mediaId, function () { next(); });
      }, function () {
        next(); // offline or storage full: keep streaming from the network
      });

  }
  function clearCache() {
    var id;
    for (id in blobs) if (Object.prototype.hasOwnProperty.call(blobs, id)) dropBlob(id);
    cacheQueue = []; cacheQueued = {};
    try { window.localStorage.removeItem(LAST_KEY); window.localStorage.removeItem(INDEX_KEY); } catch (e) {}
    if (canCache) { try { window.caches['delete'](CACHE_NAME).then(null, function () {}); } catch (e2) {} }
  }
  function rememberState(d) {
    if (!d || typeof d.version !== 'number') return;
    if (!canCache) return;
    writeJsonKey(LAST_KEY, { version: d.version, mediaId: d.mediaId || null, url: d.url || null, playlist: d.playlist || null });
    cacheMedia(d);
  }
  // No server on start-up: play what this TV showed last, from its saved files.
  function playSaved(g) {
    var last, list, pending, i;
    if (!canCache || triedOffline) return;
    triedOffline = true;
    last = readJsonKey(LAST_KEY);
    list = mediaList(last);
    if (!last || typeof last.version !== 'number' || !list.length) return;
    pending = list.length;
    for (i = 0; i < list.length; i++) loadBlob(list[i].mediaId, done);
    function done() {
      pending -= 1;
      if (pending > 0) return;
      if (g !== gen || shownVersion !== null || hasImage) return; // the server answered meanwhile
      var copy = { version: last.version, mediaId: last.mediaId, url: null }, items = [], k, it;
      if (last.playlist && last.playlist.items) {
        for (k = 0; k < last.playlist.items.length; k++) {
          it = last.playlist.items[k];
          if (it && it.mediaId && blobs[it.mediaId] && !(it.kind === 'video' && blobVideoBad)) {
            items.push({ mediaId: it.mediaId, url: blobs[it.mediaId], durationMs: it.durationMs, kind: it.kind });
          }
        }
        if (!items.length) return;
        copy.playlist = { id: last.playlist.id, transition: last.playlist.transition, items: items };
        copy.url = items[0].url;
      } else if (last.mediaId && blobs[last.mediaId]) {
        copy.url = blobs[last.mediaId];
      } else {
        return;
      }
      apply(copy);
    }
  }

  // ---- token storage (memory fallback if localStorage is unavailable)
  function getToken() {
    try { var t = window.localStorage.getItem(TOKEN_KEY); if (t) return t; } catch (e) {}
    return memToken;
  }
  function setToken(t) {
    memToken = t;
    try { window.localStorage.setItem(TOKEN_KEY, t); } catch (e) {}
  }
  function clearToken() {
    memToken = null;
    paintedVersion = null; confirmedVersion = null;
    try { window.localStorage.removeItem(TOKEN_KEY); } catch (e) {}
  }

  // ---- XHR with timeout; status 0 means network failure
  function request(method, url, body, token, cb) {
    var done = false, x = null, watchdog;

      cb(status, data);

      try { if (x) x.abort(); } catch (e) {}
      finish(0, null);

      x = new XMLHttpRequest();
      x.open(method, url, true);
      try { x.timeout = 15000; } catch (e) {}

  // ---- scheduling: one timer; stale callbacks from a previous mode are ignored
  function enter(newMode) { mode = newMode; gen++; clearTimeout(timer); return gen; }
  function later(g, fn, ms) {
    clearTimeout(timer);
    timer = setTimeout(function () { if (g === gen) fn(); }, ms);
  }

  // ---- screens and image layers
  function showScreen(id) {
    var ids = ['pair', 'empty', 'connecting'];
    for (var i = 0; i < ids.length; i++) el(ids[i]).className = ids[i] === id ? 'screen on' : 'screen';
  }
  function setStatus(text) {
    var s = el('status');
    if (!s) return;
    if (text) { s.innerHTML = text; s.className = 'status on'; }
    else { s.innerHTML = ''; s.className = 'status'; }
  }
  function clearImages() {
    for (var i = 0; i < layers.length; i++) {
      layers[i].className = 'layer';
      layers[i].style.backgroundImage = 'none';

    hasImage = false;
  }
  // The new image is already fully loaded; put it on top of the old one, then hide the old one.
  // fade is only used between playlist slides. A single image keeps the original swap.
  function swapTo(url, fade) {
    var next = layers[1 - active], prev = layers[active];
    var hold = 1500;
    next.style.backgroundImage = 'url("' + url + '")';
    z++;
    next.style.zIndex = z;
    if (fade) {
      next.className = 'layer fade';
      if (next.offsetWidth < 0) next.className = 'layer fade';
      next.className = 'layer fade on';
      hold = 900;
    } else {
      next.className = 'layer on';
    }
    active = 1 - active;
    hasImage = true;
    showScreen('');
    setTimeout(function () {
      if (layers[active] !== prev) { prev.className = 'layer'; prev.style.backgroundImage = 'none'; }
    }, hold);

  function clearSlideTimer() {
    if (slideTimer) { clearTimeout(slideTimer); slideTimer = null; }
  }
  function stopPlaylist() {
    playlist = null;
    clearSlideTimer();
    clearWatch();
    slideToken++;
    needRefresh = false;
    urlRefreshAt = 0;
    loadedUrls = {};
    badSkips = {};
    badLevel = {};
    skipBurst = 0;
    releaseAllVideos();
  }
  function clearWatch() {
    if (watchTimer) { clearTimeout(watchTimer); watchTimer = null; }
  }
  function otherVideo(v) { return v === videos[0] ? videos[1] : videos[0]; }
  function resolveUrl(item) {
    var local = blobFor(item);
    if (local) return local;
    if (item.mediaId && stableSrc[item.mediaId]) return stableSrc[item.mediaId];
    return item.url;
  }
  function pinUrl(item, url) {
    if (item.mediaId) stableSrc[item.mediaId] = url;

  }
  function dropPin(item) {

  }
  function releaseVideo(v) {
    if (!v) return;

    v.onerror = null;
    v.ontimeupdate = null;

    v.className = 'stage';
    try { v.removeAttribute('data-id'); } catch (e2) {}
    try { v.removeAttribute('data-src'); } catch (e3) {}
    try { v.removeAttribute('src'); v.load(); } catch (e4) {}
  }
  function releaseAllVideos() {
    var i;
    for (i = 0; i < videos.length; i++) releaseVideo(videos[i]);
    shownVideo = null;
  }
  function hideImages() {
    var i;
    for (i = 0; i < layers.length; i++) layers[i].className = 'layer';
  }
  function buryVideos(keepId) {
    var i, id;
    for (i = 0; i < videos.length; i++) {
      id = videos[i].getAttribute ? videos[i].getAttribute('data-id') : '';
      videos[i].className = 'stage';
      try { videos[i].pause(); } catch (e) {}
      if (!keepId || id !== keepId) releaseVideo(videos[i]);

  }
  function fitVideo(v) {

    var sw = window.innerWidth || 1280, sh = window.innerHeight || 720;
    var scale, w, h;

    w = Math.round(vw * scale);
    h = Math.round(vh * scale);
    v.style.width = w + 'px';
    v.style.height = h + 'px';
    v.style.left = Math.round((sw - w) / 2) + 'px';
    v.style.top = Math.round((sh - h) / 2) + 'px';
  }
  function armVideo(v, item) {
    if (badSkips[itemKey(item)]) return '';
    var url = resolveUrl(item);
    v.muted = true;
    try { v.playsInline = true; } catch (e) {}
    try { v.setAttribute('muted', 'muted'); } catch (e2) {}
    try { v.setAttribute('playsinline', 'playsinline'); } catch (e3) {}
    try { v.setAttribute('webkit-playsinline', 'webkit-playsinline'); } catch (e4) {}

    v.style.zIndex = String(z);
    v.className = 'stage on';

  function failVideo(index, item, message) {

        blobVideoBad = true;
        releaseItemVideo(item);
        clearSlideTimer();
        slideTimer = setTimeout(function () {
          if (token !== slideToken || !playlist) return;
          present(index, versionOrNull);
        }, 0);
        return;
      }
      failVideo(index, item, message);
    }
    function watchPlayback() {
      function tick() {
        var nowT;
        if (gone() || shownVideo !== v) return;
        if (!sawTime) { watchTimer = setTimeout(tick, 2000); return; }
        nowT = v.currentTime || 0;
        if (nowT <= lastTime + 0.05) stuckFor += 2000;
        else stuckFor = 0;
        lastTime = nowT;
        if (stuckFor >= failCap(item)) { failOnce('This video stalled.'); return; }
        watchTimer = setTimeout(tick, 2000);
      }
      clearWatch();
      watchTimer = setTimeout(tick, 2000);
    }
    function go() {
      if (gone() || started) return;
      started = true;
      clearTimeout(startTimer);
      pinUrl(item, url);
      showVideo(v);
      slideIndex = index;
      if (typeof versionOrNull === 'number') { shownVersion = versionOrNull; clearReportedError(); }
      if (typeof shownVersion === 'number') markPainted(shownVersion);
      preloadIndex((index + 1) % playlist.items.length);
      watchPlayback();
    }
    v.onplaying = function () {
      // Reveal only once the element has started. A rejected play() or an error
      // before this never adds the visible class. Known-bad clips never get here
      // because their src is not set.
      if (!gone()) go();
    };
    v.ontimeupdate = function () {
      if (gone()) return;
      lastTime = v.currentTime || 0;
      sawTime = true;
      stuckFor = 0;
    };
    v.onended = function () {
      var again;
      if (gone()) return;
      clearWatch();
      if (playlist.items.length === 1) {
        try {
          v.currentTime = 0;
          again = v.play();
          if (again && typeof again.then === 'function') {
            again.then(function () {}, function () { failOnce("This video can't play on this TV."); });
          }
        } catch (e) { failOnce("This video can't play on this TV."); }
        return;
      }
      present((index + 1) % playlist.items.length, null);
    };
    v.onerror = function () { failOnce("This video can't play on this TV."); };
    startTimer = setTimeout(function () { failOnce('This video did not start in time.'); }, failCap(item));
    try {
      var playResult = v.play();
      if (playResult && typeof playResult.then === 'function') {
        playResult.then(function () {}, function () { failOnce('This video was blocked from autoplaying.'); });
      }
    } catch (err) {
      failOnce("This video can't play on this TV.");
    }
  }
  function present(index, versionOrNull) {
    if (!playlist) return;
    var item = playlist.items[index];
    var token = slideToken;
    var src, nextItem;
    if (!item) return;
    if (skipKnownBad(item)) {
      skipBurst += 1;
      clearSlideTimer();
      releaseItemVideo(item);
      if (skipBurst > playlist.items.length) {
        skipBurst = 0;
        setStatus("This video can't play on this TV.");
        slideTimer = setTimeout(function () {
          if (token !== slideToken || !playlist) return;
          present(index, null);
        }, 8000);
        return;
      }
      present((index + 1) % playlist.items.length, null);
      return;
    }
    skipBurst = 0;
    if (item.kind === 'video') { presentVideo(index, versionOrNull); return; }
    src = resolveUrl(item);
    function commit() {
      if (token !== slideToken || !playlist) return;
      nextItem = nextGoodItem(index);
      swapTo(src, playlist.transition === 'fade');
      buryVideos(nextItem && nextItem.kind === 'video' && !badSkips[itemKey(nextItem)] ? (nextItem.mediaId || '') : '');
      slideIndex = index;
      if (typeof versionOrNull === 'number') { shownVersion = versionOrNull; clearReportedError(); }
      if (typeof shownVersion === 'number') markPainted(shownVersion);
      preloadIndex((index + 1) % playlist.items.length);
      clearSlideTimer();
      var waitToken = slideToken;
      slideTimer = setTimeout(function () {
        if (waitToken !== slideToken || !playlist) return;
        present((index + 1) % playlist.items.length, null);
      }, item.durationMs);
    }
    if ((item.mediaId && stableSrc[item.mediaId]) || loadedUrls[src] === 1) { commit(); return; }
    var img = new Image();
    img.onload = function () { pinUrl(item, src); commit(); };
    img.onerror = function () {
      if (token !== slideToken) return;
      if (src.indexOf('blob:') === 0) dropBlob(item.mediaId);
      dropPin(item);
      needRefresh = true;
      clearSlideTimer();
      slideTimer = setTimeout(function () {
        if (token !== slideToken) return;
        present(index, versionOrNull);
      }, 3000);
    };
    img.src = src;
  }
  function refreshPlaylistUrls(items) {
    var i;
    if (!playlist) return;
    for (i = 0; i < playlist.items.length && i < items.length; i++) {
      if (playlist.items[i].mediaId === items[i].mediaId) {
        playlist.items[i].url = items[i].url;
        playlist.items[i].durationMs = items[i].durationMs;
        if (items[i].kind === 'video' || items[i].kind === 'image') playlist.items[i].kind = items[i].kind;
      }
    }
    needRefresh = false;
    urlRefreshAt = new Date().getTime() + 1800000;
  }
  function beginPlaylist(version, incoming) {
    var items = [], list = incoming.items || [], i, it, ms;
    for (i = 0; i < list.length; i++) {
      it = list[i];
      ms = it && it.durationMs;
      if (!it || !it.url) continue;
      if (it.kind === 'video') {
        items.push({ url: it.url, durationMs: typeof ms === 'number' ? ms : 0, mediaId: it.mediaId || '', kind: 'video' });
        continue;
      }
      if (typeof ms !== 'number' || ms < 1000) continue;
      items.push({ url: it.url, durationMs: ms, mediaId: it.mediaId || '', kind: 'image' });
    }
    if (!items.length) return;
    if (playlist && shownVersion === version && playlist.id === (incoming.id || '')) {
      refreshPlaylistUrls(items);
      return;
    }
    preloadImg = null;
    loadingVersion = null;
    stopPlaylist();
    playlist = {
      id: incoming.id || '',
      transition: incoming.transition === 'fade' ? 'fade' : 'none',
      items: items
    };
    urlRefreshAt = new Date().getTime() + 1800000;
    shownVersion = version;
    present(0, version);
  }

  // ---- pairing
  function startPairing() {
    var g = enter('pairing');
    stopPlaylist();
    stableSrc = {};
    badSkips = {};
    badLevel = {};
    clearImages();
    setStatus('');
    shownVersion = null; loadingVersion = null; preloadImg = null;
    el('code').innerHTML = '&nbsp;';
    showScreen('pair');
    request('POST', '/api/player/pair', {}, null, function (status, data) {
      if (g !== gen) return;
      if (status === 200 && data && data.code && /^\d{6}$/.test(data.code)) {
        el('code').innerHTML = data.code.substr(0, 3) + ' ' + data.code.substr(3);
        pollPairing(g, data.sessionId, data.secret);
      } else {
        later(g, startPairing, status === 429 ? 60000 : RETRY_MS);
      }
    });
  }
  function pollPairing(g, sessionId, secret) {
    later(g, function () {
      request('POST', '/api/player/pair/status', { sessionId: sessionId, secret: secret }, null,
        function (status, data) {
          if (g !== gen) return;
          if (status === 200 && data) {
            if (data.status === 'paired' && data.token) { setToken(data.token); startPlayback(); return; }
            if (data.status === 'expired') { startPairing(); return; }
          }
          pollPairing(g, sessionId, secret);
        });
    }, PAIR_MS);
  }

  // ---- playback
  function startPlayback() {
    var g = enter('playing');
    pollState(g);
  }
  function pollState(g) {
    var token = getToken();
    if (!token) { startPairing(); return; }
    var v = shownVersion === null ? '' : String(shownVersion);
    var refresh = '';
    if (playlist && (needRefresh || (urlRefreshAt && new Date().getTime() > urlRefreshAt))) refresh = '&refresh=1';
    var url = '/api/player/state?v=' + encodeURIComponent(v) + refresh + '&_=' + new Date().getTime();
    request('GET', url, null, token, function (status, data) {
      if (g !== gen) return;
      if (status === 401) { clearToken(); clearCache(); startPairing(); return; } // disconnected from dashboard
      var wait = STATE_MS;
      if (status === 200 && data) {
        setStatus('');
        if (typeof data.pollMs === 'number' && data.pollMs >= 5000 && data.pollMs <= 120000) pollMs = data.pollMs;
        wait = pollMs;
        wakeAt = data.nextTransitionAt ? Date.parse(data.nextTransitionAt) || 0 : 0;
        if (wakeAt) {
          // Ask again just after a scheduled switch, so schedules stay on time.
          var until = wakeAt - new Date().getTime() + 1500;
          if (until > 0 && until < wait) wait = Math.max(1000, until);
        }
        if (!data.unchanged) { rememberState(data); apply(data); }
        confirmPlaying(); // retries a confirmation that failed while offline
      } else if (!hasImage && shownVersion === null) {
        setStatus('');
        showScreen('connecting'); // nothing on screen yet
        if (status === 0 || status >= 500) playSaved(g);
      } else {
        // Keep the last image (or the empty state) and say we're retrying.
        setStatus('Reconnecting...');
      }
      later(g, function () { pollState(g); }, wait);
    });
  }
  function apply(d) {
    if (typeof d.version !== 'number') return;
    if (d.playlist && d.playlist.items && d.playlist.items.length) {
      beginPlaylist(d.version, d.playlist);
      return;
    }
    stopPlaylist();
    if (!d.url) {
      preloadImg = null; loadingVersion = null;
      clearImages();
      showScreen('empty');
      shownVersion = d.version;
      clearReportedError();
      return;
    }
    if (loadingVersion === d.version) return; // already downloading this one
    var img = new Image(), v = d.version, src = (d.mediaId && blobs[d.mediaId]) || d.url;
    loadingVersion = v;
    preloadImg = img;
    var giveUp = setTimeout(function () {
      if (preloadImg === img) { preloadImg = null; loadingVersion = null; }
    }, LOAD_TIMEOUT_MS);
    img.onload = function () {
      clearTimeout(giveUp);
      if (preloadImg !== img) return;
      preloadImg = null; loadingVersion = null;
      swapTo(src);
      shownVersion = v;
      clearReportedError();
      markPainted(v);
    };
    img.onerror = function () {
      // Keep the last image; next poll gets a fresh URL and retries.
      clearTimeout(giveUp);
      if (src.indexOf('blob:') === 0) dropBlob(d.mediaId);
      if (preloadImg === img) { preloadImg = null; loadingVersion = null; }
    };
    img.src = src;
  }

  // ---- fullscreen on first interaction, if supported (never required)
  function tryFullscreen() {
    var d = document.documentElement;
    var fn = d.requestFullscreen || d.webkitRequestFullscreen || d.webkitRequestFullScreen || d.msRequestFullscreen;
    if (fn) { try { fn.call(d); } catch (e) {} }
    document.removeEventListener('click', tryFullscreen);
    document.removeEventListener('keydown', tryFullscreen);
  }
  document.addEventListener('click', tryFullscreen);
  document.addEventListener('keydown', tryFullscreen);

  // Check right away when the network comes back.
  window.addEventListener('online', function () { if (mode === 'playing') startPlayback(); });

  if (getToken()) startPlayback(); else startPairing();
})();
</script>
</body>
</html>
